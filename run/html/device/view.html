<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Device Viewer - NlSACN</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel='stylesheet' type='text/css' media='screen' href='/style/default.css'>
    <script src='https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js '></script>
    <style>
        
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <h1>Device Viewer - %deviceName%</h1>
            <a href="/devices" class="navLink">Devices</a>
        </div>
        <div class="row">
            <button onclick="updateLayout()">Update Layout</button>
            <input type="text" onchange="updateAddress()" id="address">
            <button onclick="clearOrder()">Clear Order</button>
        </div>
        
    </div>

    <script>
        const uuid = "%uuid%";
        const layout = %layout%;

        let order = %order%;

        let cX = 0;
        let cY = 0;

        let minX = 9999999
        let minY = 9999999
        let maxX = -9999999
        let maxY = -9999999
        
        let cW = 600;
        let cH = 600;

        layout.forEach(panel => {
            if(panel.x < minX) {
                minX = panel.x;
            }
            if(panel.x > maxX) {
                maxX = panel.x;
            }
            if(panel.y < minY) {
                minY = panel.y;
            }
            if(panel.y > maxY) {
                maxY = panel.y;
            }
        })
        cX = (cW / 2) - ((minX + maxX) / 2)
        cY = (cH / 2) - ((-minY + -maxY) / 2)


        let address = "%address%"
        let universe = 1
        let start = 1
        function parseAddress() {
            if(address.includes("/")) {
                let parts = address.split('/')
                universe = Number(parts[0])
                start = Number(parts[1])
            } else {
                universe = 1
                start = Number(address)
            }
        }
        parseAddress()

        
        function setup() {
            createCanvas(cW, cH)
        }

        function draw() {
            background(60, 60, 60)

            push()
            translate(cX, cY)

            angleMode(DEGREES);
            for(let pI = 0; pI < layout.length; pI++) {
                const panel = layout[pI]
                push()
                translate(panel.x, -panel.y)
                rotate(-panel.o)
                if(panel.shapeType == 7) { // hexagon
                    fill(200, 200, 200)
                    
                    beginShape()
                    for(let i = 0; i < 6; i++) {
                        let angle = (360 / 6) * i;
                        vertex(cos(angle) * 65, sin(angle) * 65)
                    }
                    endShape(CLOSE)
                    rotate(panel.o)
                    
                    fill(20, 20, 20)
                    textAlign(CENTER, CENTER)
                    let adr = '-'
                    for(let i = 0; i < order.length; i++) {
                        if(order[i] == panel.panelId) {
                            adr = start + (i * 3)
                        }
                    }
                    text(`${panel.panelId}\n${universe}/${adr}`, 0, 0)

                } else if(panel.shapeType == 12) { // controller
                    fill(255, 0, 0)

                    rect(-30, -8, 60, 15)
                }
                pop()
            }

            pop()
        }


        function mouseClicked() {
            let x = mouseX - cX
            let y = mouseY - cY
            layout.forEach(p => {
                if(p.shapeType == 12) // skip controllers
                    return;
                let d = dist(x, y, p.x, -p.y)
                let md = 30
                if(p.shapeType == 7)
                    md = 50
                if(d < md) {
                    if(!order.includes(p.panelId)) {
                        order.push(p.panelId)
                        pushOrder();
                    }
                }
            })
        }

        function clearOrder() {
            order = []
            pushOrder()
        }

        function pushOrder() {
            fetch(`/api/device/${uuid}/setOrder`,{
                method: 'POST',
                body: JSON.stringify({order: order})
            })
        }

        function hexagonPanel() {
            beginShape()
            for(let i = 0; i < 6; i++) {
                let angle = (TWO_PI / 6 * i);
                vertex(cos(angle) * 60, sin(angle) * 60)
            }
            endShape(CLOSE)
        }

        function testState() {
            let state = []
            for(let i = 0; i < layout.length; i++) {
                const p = layout[i]
                if(p.shapeType == 12)
                    continue;
                state.push({
                    panelId: p.panelId,
                    r: (i % 3 == 0) ? 255 : 0,
                    g: (i % 3 == 1) ? 255 : 0,
                    b: (i % 3 == 2) ? 255 : 0
                })
            }
            fetch(`/api/device/${uuid}/setState`,{
                method: 'POST',
                headers: {
                    ['content-type']: 'application/json'
                },
                body: JSON.stringify({state: state})
            }).then(rsp => rsp.text()).then(text => alert(text))
        }

        const addressEl = document.getElementById("address");
        addressEl.value = address
        function updateAddress() {
            address = addressEl.value
            parseAddress()
            fetch(`/api/device/${uuid}/setAddress`,{
                method: 'POST',
                headers: {
                    ['content-type']: 'application/json'
                },
                body: JSON.stringify({address: address})
            }).then(rsp => {
                if(!rsp.ok)
                    rsp.text().then(text => alert(text + '; code '+rsp.code))
            })
        }

        function updateLayout() {
            fetch('/devices', {
                method: 'POST',
                body: JSON.stringify({
                    action: 'update',
                    uuid: uuid
                })
            }).then(rsp => rsp.text()).then(text => { alert(text); window.location = `?uuid=${uuid}`; })
        }
    </script>

    $BANNER$
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
