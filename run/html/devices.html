<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Devices - NlSACN</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel='stylesheet' type='text/css' media='screen' href='/style/default.css'>
    <!-- <script src='script/common.js'></script> -->
    <style>
        
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <h1>Devices</h1>
        </div>
        
        <div class="row">
            <table>
                <thead>
                    <tr>
                        <th>UUID</th>
                        <th>Name</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="devices">

                </tbody>
            </table>
        </div>
    </div>

    <script>
        let knownDevices = %knownDevices%;

        const devicesEl = document.getElementById("devices")

        function refresh() {
            fetch('?list').then(rsp => rsp.json()).then(json => {
                knownDevices = json;
                devicesEl.innerHTML = ""
                knownDevices.forEach(addDevice);
            })
        }

        function addDevice(d) {
            const device = d
            const tr = document.createElement("tr");
            devicesEl.appendChild(tr);

            const uuidEl = document.createElement("td");
            uuidEl.innerText = d.uuid;
            tr.appendChild(uuidEl)
            
            const nameEl = document.createElement("td");
            nameEl.innerText = d.deviceName;
            tr.appendChild(nameEl)

            const addCol = document.createElement('td');
            tr.appendChild(addCol)
            
            if(!d.active) {
                const addBtn = document.createElement('button')
                addCol.appendChild(addBtn);
                addBtn.innerText = "Add";
                addBtn.onclick = () => {
                    if(!confirm('Hold the on-off button for 5-7 seconds until the LED starts flashing')) {
                        return;
                    }
                    fetch('', {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'add',
                            uuid: device.uuid
                        })
                    }).then(rsp => rsp.text()).then(text => { alert(text); refresh() })
                }
            } else {
                const idBtn = document.createElement('button')
                addCol.appendChild(idBtn);
                idBtn.innerText = "Identify";
                idBtn.onclick = () => {
                    fetch('', {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'identify',
                            uuid: device.uuid
                        })
                    }).then(rsp => rsp.text()).then(text => { alert(text) })
                }
                const rmBtn = document.createElement('button')
                addCol.appendChild(rmBtn);
                rmBtn.innerText = "Remove";
                rmBtn.onclick = () => {
                    fetch('', {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'remove',
                            uuid: device.uuid
                        })
                    }).then(rsp => rsp.text()).then(text => { alert(text); refresh() })
                }
                const updateBtn = document.createElement('button')
                addCol.appendChild(updateBtn);
                updateBtn.innerText = "Update";
                updateBtn.onclick = () => {
                    fetch('', {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'update',
                            uuid: device.uuid
                        })
                    }).then(rsp => rsp.text()).then(text => { alert(text); refresh() })
                }
                const viewA = document.createElement('a')
                addCol.appendChild(viewA);
                viewA.innerText = "View";
                viewA.href = "/device/view?uuid="+device.uuid
            }
        }

        knownDevices.forEach(addDevice);

        setInterval(refresh, 1000)
    </script>

    $BANNER$
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
